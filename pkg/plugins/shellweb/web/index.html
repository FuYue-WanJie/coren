<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coren</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <h1>Coren</h1>
    <span id="status">就绪</span>
  </header>

  <main id="messages" aria-live="polite"></main>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button type="submit" id="send">发送</button>
  </form>

  <div id="login" class="overlay hidden">
    <form id="login-form" class="login-box">
      <h2>登录 Coren</h2>
      <p id="login-error" class="login-error"></p>
      <input type="password" id="password" placeholder="访问密码" autocomplete="current-password" />
      <button type="submit">登录</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
