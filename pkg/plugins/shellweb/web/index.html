<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coren</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" />
  <link rel="stylesheet" href="vendor/material-icons.css" />
  <link rel="stylesheet" href="vendor/mdui.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <mdui-layout full-height>
    <mdui-top-app-bar class="appbar">
      <mdui-button-icon id="menu-toggle" icon="menu"></mdui-button-icon>
      <mdui-top-app-bar-title id="appbar-title">Coren</mdui-top-app-bar-title>
      <span id="status" class="appbar-status">就绪</span>
      <div style="flex-grow: 1"></div>
    </mdui-top-app-bar>

    <mdui-navigation-drawer id="drawer" open>
      <div class="drawer-head">
        <span class="drawer-title">会话</span>
        <mdui-button-icon id="new-session" icon="add"></mdui-button-icon>
      </div>
      <mdui-list id="session-list"></mdui-list>
    </mdui-navigation-drawer>

    <mdui-layout-main class="main">
      <div id="webui-notice" class="notice hidden">
        <span id="webui-notice-text"></span>
        <span class="notice-actions">
          <mdui-button id="webui-update" variant="filled">更新</mdui-button>
          <mdui-button id="webui-dismiss" variant="text">保留</mdui-button>
        </span>
      </div>

      <main id="messages" class="messages" aria-live="polite"></main>

      <form id="composer" class="composer">
        <mdui-text-field id="input" class="composer-input" rows="1" autosize
          placeholder="输入消息，Enter 发送" variant="outlined"></mdui-text-field>
        <mdui-button-icon id="send" class="composer-send" icon="send" variant="filled"></mdui-button-icon>
      </form>
    </mdui-layout-main>
  </mdui-layout>

  <script src="vendor/mdui.global.js"></script>
  <script src="app.js"></script>
</body>
</html>
